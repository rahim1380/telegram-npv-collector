name: Automatic Telegram Config Update

on:
  workflow_dispatch:

  push:
    paths:
      - "npvt_inputs/**"

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: automatic-telegram-config-update
  cancel-in-progress: false

jobs:
  update-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download new NPVT files from Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python npvt_telegram_downloader.py

      - name: Import NPVT files
        run: python npvt_importer.py

      - name: Run Telegram collector and build merged subscription
        run: python collector.py

      - name: Install Xray
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fsSL -o /tmp/Xray-linux-64.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o /tmp/Xray-linux-64.zip -d /tmp/xray
          sudo install -m 0755 /tmp/xray/xray /usr/local/bin/xray
          xray version

      - name: Test configs and keep working ones
        env:
          XRAY_BIN: /usr/local/bin/xray
        run: python run_recent_tests.py

      - name: Save subscription and archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add subscription.txt
          git add .github/workflows/update.yml
          git add requirements.txt
          git add run_recent_tests.py
          git add config_tester.py
          git add data/archive.json
          git add data/blacklist.txt
          git add data/npvt_configs.json
          git add data/npvt_recent_configs.json
          git add data/npvt_telegram_state.json
          git add data/npvt_download_hashes.json
          git add npvt_inputs/

          git diff --cached --quiet || git commit -m "Update Telegram and NPVT subscriptions"
          git push
