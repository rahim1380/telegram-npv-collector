name: Automatic Telegram Config Update

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write

jobs:
  update-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python collector.py

      - name: Save subscription and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add subscription.txt
          git add data/archive.json
          git add data/blacklist.txt

          git diff --cached --quiet || git commit -m "Automatic VPN config update"
          git push
