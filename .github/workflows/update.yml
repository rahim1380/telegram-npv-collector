name: Automatic Telegram Config Update

on:
  workflow_dispatch:

  push:
    paths:
      - "npvt_inputs/**"

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import NPVT files
        run: python npvt_importer.py

      - name: Run Telegram collector and build merged subscription
        run: python collector.py

      - name: Save subscription and archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add subscription.txt
          git add data/archive.json
          git add data/blacklist.txt
          git add data/npvt_configs.json

          git diff --cached --quiet || git commit -m "Update merged VPN subscription"
          git push
